<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product preview </title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main class="page">
      <article class="product-card">
        <img class="product-image product-image-desktop" src="images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
        <img class="product-image product-image-mobile" src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
        <div class="product-info">
          <p class="product-category">PERFUME</p>
          <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
          <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer
-Creator for the House of CHANEL.</p>
          <div class="price">
            <h2 class="current-price">$149.99</h2>
            <p class="old-price">$169.99</p>
          </div>
          <button class="add-to-cart">
            <img class="cart-icon" src="images/icon-cart.svg" alt="">
            Add to Cart
          </button>
        </div>
      </article>
    </main>
</body>
</html>
